name: Update NFL projections
on:
  workflow_dispatch:
  schedule:
    # Refresh every day in season, including Saturday, Sunday and Monday.
    - cron: "20 11 * 9-12,1 *"
    # A second pregame Sunday refresh catches late upstream roster/stat changes.
    - cron: "20 15 * 9-12,1 0"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update_predictions.yml"
permissions:
  contents: write
concurrency:
  group: update-nfl-projections
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python scripts/build_predictions.py
      - run: python scripts/add_prediction_ranges.py
      - run: pytest -q
      - name: Check published slate
        run: python scripts/check_publication.py
      - name: Commit refreshed outputs
        run: |
          git config user.name "football-prop-edge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data models || true
          git diff --cached --quiet || git commit -m "Update NFL projections"

          # The site/code can receive commits while this longer model run is
          # executing. Rebase the generated-output commit onto the latest main
          # before pushing so those unrelated commits do not cause a
          # non-fast-forward failure.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
